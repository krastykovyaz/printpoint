<text x="1050" y="2450" font-family="DejaVu Sans, Arial, sans-serif" font-size="36" font-weight="400" fill="#555" text-anchor="middle" >Your file is deleted as soon as your order is printed.  ·  No CV yet? Create one free at tsech.online</text>
